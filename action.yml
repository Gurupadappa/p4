name: "P4 security gate"
description: "Scan a repo with P4's Prepare -> Scan -> Validate pipeline and fail the build on confirmed, LLM-validated vulnerabilities. Uploads results as SARIF for GitHub code scanning."
author: "P4"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to the repo to scan, relative to the caller's workspace."
    required: false
    default: "."
  gemini-api-key:
    description: "Gemini API key used by the Validate/Prove stages. Required unless skip-validate is true."
    required: false
  fail-on:
    description: "'confirmed' (default) fails the step on any confirmed finding; 'none' always exits 0 (report-only)."
    required: false
    default: "confirmed"
  min-severity:
    description: "Only gate/report findings at or above this severity: low, medium, high, critical."
    required: false
    default: "low"
  skip-validate:
    description: "Run Prepare+Scan only, no LLM calls and no API key required. Cannot gate on confirmed findings in this mode — use for smoke-testing the wiring."
    required: false
    default: "false"
  baseline-commit:
    description: "Only report findings not already present at this commit (diff-aware scanning), so adopting P4 in a repo with pre-existing findings doesn't fail every PR. Defaults to the PR's base commit on pull_request events; pass '' explicitly to force a full scan. The checkout step needs `fetch-depth: 0` (or at least enough history to reach this commit) for it to be found."
    required: false
    default: ""

outputs:
  sarif-path:
    description: "Path to the generated SARIF report."
    value: ${{ steps.scan.outputs.sarif-path }}
  exit-code:
    description: "Exit code from `p4 scan` (0 = pass, 1 = gate failure, 2 = error)."
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install p4
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run p4 scan
      id: scan
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        BASELINE_COMMIT: ${{ inputs.baseline-commit || github.event.pull_request.base.sha }}
      run: |
        set +e
        sarif_path="${{ github.workspace }}/p4-results.sarif"
        args=(scan "${{ inputs.path }}" --min-severity "${{ inputs.min-severity }}" --fail-on "${{ inputs.fail-on }}" --format sarif -o "$sarif_path")
        if [ "${{ inputs.skip-validate }}" = "true" ]; then
          args+=(--skip-validate)
        fi
        if [ -n "$BASELINE_COMMIT" ]; then
          args+=(--baseline-commit "$BASELINE_COMMIT")
        fi
        p4 "${args[@]}"
        code=$?
        echo "sarif-path=$sarif_path" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-path }}

    - name: Enforce gate
      if: always() && steps.scan.outputs.exit-code != '0'
      shell: bash
      run: exit ${{ steps.scan.outputs.exit-code }}
